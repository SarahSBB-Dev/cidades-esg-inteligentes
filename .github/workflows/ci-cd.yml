name: CI/CD - Cidades ESG Inteligentes

# Fluxo de branches: feature/* -> develop (staging) -> main (produção)
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  # Nome do repositório da imagem no Docker Hub
  IMAGE_NAME: 'cidades-esg-inteligentes'

jobs:
  # ETAPA 1 - Build automático + testes automatizados
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5

      - name: Setup Java SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Testes automatizados
        run: mvn -B test

      - name: Build do projeto (gera o app.jar)
        run: mvn -B package -DskipTests

  # ETAPA 2 - Build da imagem Docker e envio para o Docker Hub
  docker:
    name: Build e push da imagem Docker
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v6
        with:
          push: true
          file: ./Dockerfile
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  # ETAPA 3 - Deploy automático no ambiente de STAGING
  deploy-staging:
    name: Deploy em staging
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: 'staging'
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5

      - name: Criar o arquivo .env do ambiente
        run: |
          echo "PROFILE=stg" > .env
          echo "DB_NAME=esg_staging" >> .env
          echo "DB_ROOT_PASSWORD=$(openssl rand -hex 12)" >> .env
          echo "APP_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> .env

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Baixar a imagem publicada no Docker Hub
        run: docker compose pull

      - name: Subir o ambiente (API + MySQL)
        run: docker compose up -d --no-build

      - name: Verificar se o ambiente está no ar
        run: bash scripts/verificar-ambiente.sh http://localhost:8080 stg

      - name: Testar a API no ambiente
        run: bash scripts/testar-api.sh http://localhost:8080

      - name: Containers em execução
        run: docker compose ps

      - name: Logs da aplicação
        if: always()
        run: docker compose logs api --tail 40

      - name: Encerrar o ambiente
        if: always()
        run: docker compose down -v

  # ETAPA 4 - Deploy no ambiente de PRODUÇÃO (somente na branch main e se staging deu certo)
  deploy-producao:
    name: Deploy em produção
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: 'production'
    steps:
      - name: Git Checkout
        uses: actions/checkout@v5

      - name: Criar o arquivo .env do ambiente
        run: |
          echo "PROFILE=prd" > .env
          echo "DB_NAME=esg_producao" >> .env
          echo "DB_ROOT_PASSWORD=$(openssl rand -hex 12)" >> .env
          echo "APP_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> .env

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Baixar a imagem publicada no Docker Hub
        run: docker compose pull

      - name: Subir o ambiente (API + MySQL)
        run: docker compose up -d --no-build

      - name: Verificar se o ambiente está no ar
        run: bash scripts/verificar-ambiente.sh http://localhost:8080 prd

      - name: Testar a API no ambiente
        run: bash scripts/testar-api.sh http://localhost:8080

      - name: Containers em execução
        run: docker compose ps

      - name: Logs da aplicação
        if: always()
        run: docker compose logs api --tail 40

      - name: Encerrar o ambiente
        if: always()
        run: docker compose down -v
