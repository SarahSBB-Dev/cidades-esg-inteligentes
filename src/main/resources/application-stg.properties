# Profile stg: ambiente de STAGING (homologação) no Azure Web App
# Se a variável DATABASE_URL for configurada no Azure, usa esse banco; senão usa um banco em memória
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:esg_stg;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PWD:}
